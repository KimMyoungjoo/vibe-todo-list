<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top-header">
        <div class="header-container">
            <h1>Vibe Todo List</h1>
            <div class="top-actions">
                <input type="text" id="search-input" placeholder="할 일 검색...">
                <button id="open-add-modal-btn">할 일 추가</button>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div class="main-container">
            <ul id="todo-list">
                </ul>
        </div>
    </main>

    <div id="todo-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">할 일 추가</h2>
            
            <div class="form-group">
                <label for="modal-todo-input">할 일 내용</label>
                <input type="text" id="modal-todo-input" placeholder="할 일을 입력하세요...">
            </div>

            <div class="form-group">
                <label for="modal-date-input">마감일</label>
                <input type="date" id="modal-date-input">
            </div>

            <div class="form-group">
                <label for="modal-category-select">카테고리</label>
                <select id="modal-category-select">
                    <option value="전체">선택 안 함</option>
                    <option value="공부">📝 공부</option>
                    <option value="과제">💻 과제</option>
                    <option value="일상">☕ 일상</option>
                    <option value="기타">📌 기타</option>
                </select>
            </div>

            <div class="modal-actions">
                <button id="modal-delete-btn" class="danger-btn">삭제</button>
                <button id="modal-close-btn" class="secondary-btn">취소</button>
                <button id="modal-save-btn" class="primary-btn">저장</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
